services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}
      PORT: ${PORT:?PORT must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CANONICAL_TREE_TITLE: ${CANONICAL_TREE_TITLE:?CANONICAL_TREE_TITLE must be set}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:?PUBLIC_APP_ORIGIN must be set}
