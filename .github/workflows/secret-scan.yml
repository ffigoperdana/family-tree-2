name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks CLI
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "${RUNNER_TEMP}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "$RUNNER_TEMP" gitleaks

      - name: Scan complete Git history
        shell: bash
        run: |
          report="${RUNNER_TEMP}/gitleaks-report.json"
          set +e
          "$RUNNER_TEMP/gitleaks" git . \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$report" \
            --exit-code 1
          scan_status=$?
          set -e

          if [[ -s "$report" ]]; then
            finding_count="$(jq 'length' "$report")"
            if [[ "$finding_count" -gt 0 ]]; then
              echo "Gitleaks detected ${finding_count} finding(s). Secret values are redacted."
              jq -r '.[] | "- rule=\(.RuleID) file=\(.File):\(.StartLine)-\(.EndLine) commit=\(.Commit) description=\(.Description) link=\(.Link)"' "$report"
            fi
          elif [[ "$scan_status" -ne 0 ]]; then
            echo "Gitleaks exited with ${scan_status}; no JSON report was produced."
          fi

          exit "$scan_status"
