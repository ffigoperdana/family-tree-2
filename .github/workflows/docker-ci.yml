name: Docker Compose CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build, Health, and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up --detach --build

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          app_id=""
          status=""
          for attempt in $(seq 1 45); do
            app_id="$(docker compose ps -q app)"
            if [[ -n "$app_id" ]]; then
              status="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
              if [[ "$status" == "healthy" ]]; then
                break
              fi
            fi
            sleep 2
          done

          [[ -n "$app_id" ]]
          [[ "$status" == "healthy" ]]
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/ready

      - name: Run RBAC, BOLA, CSRF, and share smoke test
        run: docker compose exec --no-TTY app npm --prefix /app/server run smoke

      - name: Show diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down test stack
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
