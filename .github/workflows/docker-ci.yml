name: Docker Compose CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - ".env.example"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker-ci.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.local.yml"
      - ".env.example"
      - "server/**"
      - "web/**"
      - ".github/workflows/docker-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build, Health, and Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          admin_password="$(openssl rand -hex 24)"
          user_password="$(openssl rand -hex 24)"
          session_secret="$(openssl rand -hex 32)"
          {
            printf 'NODE_ENV=development\n'
            printf 'PORT=8080\n'
            printf 'COOKIE_SECURE=0\n'
            printf 'POSTGRES_DB=soenarto_ci\n'
            printf 'POSTGRES_USER=soenarto_ci\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$db_password"
            printf 'DATABASE_URL=postgres://soenarto_ci:%s@db:5432/soenarto_ci\n' "$db_password"
            printf 'SESSION_SECRET=%s\n' "$session_secret"
            printf 'BOOTSTRAP_ADMIN_USERNAME=admin\n'
            printf 'BOOTSTRAP_ADMIN_PASSWORD=%s\n' "$admin_password"
            printf 'SMOKE_ADMIN_USERNAME=admin\n'
            printf 'SMOKE_ADMIN_PASSWORD=%s\n' "$admin_password"
            printf 'SMOKE_USER_PASSWORD=%s\n' "$user_password"
            printf 'CANONICAL_TREE_TITLE=Keluarga Haji Soenarto\n'
            printf 'PUBLIC_APP_ORIGIN=http://127.0.0.1:8080\n'
            printf 'APP_BIND_HOST=127.0.0.1\n'
            printf 'APP_PORT=8080\n'
          } > .env.ci

      - name: Validate Compose configuration
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml config --quiet

      - name: Build and start stack
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml up --detach --build

      - name: Wait for application health
        shell: bash
        run: |
          set -euo pipefail
          app_id=""
          status=""
          for attempt in $(seq 1 45); do
            app_id="$(docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml ps -q app)"
            if [[ -n "$app_id" ]]; then
              status="$(docker inspect --format '{{.State.Health.Status}}' "$app_id" 2>/dev/null || true)"
              if [[ "$status" == "healthy" ]]; then
                break
              fi
            fi
            sleep 2
          done

          [[ -n "$app_id" ]]
          [[ "$status" == "healthy" ]]
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          curl --fail --silent --show-error http://127.0.0.1:8080/ready

      - name: Run RBAC, BOLA, CSRF, and share smoke test
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env.ci
          set +a
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml exec --no-TTY \
            -e SMOKE_ADMIN_USERNAME="$SMOKE_ADMIN_USERNAME" \
            -e SMOKE_ADMIN_PASSWORD="$SMOKE_ADMIN_PASSWORD" \
            -e SMOKE_USER_PASSWORD="$SMOKE_USER_PASSWORD" \
            app npm --prefix /app/server run smoke

      - name: Show diagnostics on failure
        if: ${{ failure() }}
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml ps || true
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml logs --no-color || true

      - name: Tear down test stack
        if: ${{ always() }}
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.local.yml down --volumes --remove-orphans || true

      - name: Remove ephemeral CI environment
        if: ${{ always() }}
        run: rm -f .env.ci
